name: Smart Diagnostics Systems
description: >-
  Smart Diagnostics Systems (SDS) is a food-safety diagnostics company based in
  Columbia, Missouri, founded in 2016 and backed by Techstars. SDS builds the
  PathoMeter, a state-of-the-art rapid diagnostic system for the detection of
  foodborne pathogens such as E. coli, Listeria, and Salmonella, helping food
  processors and companies protect consumers from foodborne illness. The company
  operates as a hardware and laboratory diagnostics business; as of this
  enrichment pass it publishes no public developer API, SDK, or developer portal.
  This API Evangelist profile tracks the company for API-surface discovery and is
  re-evaluated on each enrichment run.
